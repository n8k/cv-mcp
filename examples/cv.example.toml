title = "Quarterly to monthly releases across 40 teams"
situation = "Large-batch quarterly releases caused frequent rollbacks and slow feedback."
task = "Shorten the cycle without raising operational risk."
action = "Redesigned the PI cadence, introduced release trains with automated gates, and coached team leads through the change."
result = "Monthly releases within two PIs; rollbacks down 60%."
