[[case_studies]]
id = "cv-mcp"
title = "This CV, served over MCP"
situation = "A PDF CV shows nothing about AI-native ways of working."
task = "Make the CV itself an AI-native artifact any agent can query."
action = "Built a Python/FastMCP server exposing structured CV tools, a role-fit tool and case studies over Streamable HTTP, deployable to Copilot Studio or Claude as a connector, with automated tests and a testing tier before production."
result = "Reviewers can interrogate the CV conversationally; the role-fit tool shows evidence against each criterion instead of claims."
tags = ["MCP", "agentic AI", "generative AI", "Copilot Studio", "Python", "innovation"]

[[case_studies]]
id = "homelab-agents"
title = "Self-hosted multi-agent platform"
situation = "Wanted hands-on, day-to-day experience of agentic AI on infrastructure under my own control."
task = "Run several AI agents on a home server, connected to real projects, with the safeguards an organisation would expect."
action = "Built a declarative NixOS server running several agent harnesses (Hermes Agent, OpenClaw, Omnigent) across multiple model providers with fallback chains, using Claude for heavy lifting and delegating simpler work to cheaper models. Gave agents access to projects through MCP servers split into read-only and token-protected control endpoints, kept secrets in sops-nix, and put changes through a Gitea, Woodpecker, Prometheus, Grafana and Loki pipeline with testing before production. Built and benchmarked Japanese-English translation agents."
result = "A working environment for testing agentic patterns end to end; its safeguards (read-only versus control access, secrets management, testing tiers, cost routing) carried straight into how this CV server was designed."
tags = ["agentic AI", "MCP", "governance", "cost control", "NixOS", "CI/CD", "Claude Code"]

