# STAR stories. Keep ids short and unique.
[[case_studies]]
id = "early-voting"
title = "Saving executives' time with Power Automate"
situation = "Business cases were reviewed in executive meetings."
task = "Cut executive meeting time without losing control or auditability."
action = "Created an online business case review process in Power Automate that accepts document submissions, alerts stakeholders and creates auditable approvals, with early voting so executives can pre-read and approve in advance."
result = "More than 50% of executive meetings eliminated."
tags = ["Power Automate", "automation", "governance", "process redesign"]

[[case_studies]]
id = "safe-transformation"
title = "Waterfall to value streams with Scaled Agile"
situation = "The delivery model was waterfall-based."
task = "Transform it to value streams to enable business agility and continuous value delivery."
action = "As a key volunteer, identified value streams, coached agile release trains, taught certification courses and updated the governance model."
result = "200+ people trained; governance model updated for continuous value delivery."
tags = ["SAFe", "agile", "change management", "governance", "operating model"]

[[case_studies]]
id = "edge-rollout"
title = "6,000 servers for the world's first cloud-native telecom launch"
situation = "Rakuten Mobile was launching the world's first cloud-native mobile network."
task = "Prepare and roll out hardware to 45 colocation data centers across Japan."
action = "Set up a central staging hub, managed internal and vendor teams of 160+ people across software development, automation and staging, and built a planning calculator to optimize rack, compute, storage, power and cabling."
result = "6,000 servers deployed across 45 colocation data centers."
tags = ["program management", "scale", "vendor management", "telecom"]

[[case_studies]]
id = "first-nations-internet"
title = "First internet service for a remote First Nations community"
situation = "A remote community had no internet service, and the build season is a two-month Northern Canada summer."
task = "Deliver connectivity within budget and that window."
action = "Managed a $1M project: 30-meter tower construction, relocating a reflector tower to a mountain top, equipment shelters, microwave dishes, permits, bids and subcontracts."
result = "Internet service delivered for the first time, within the summer window."
tags = ["delivery", "community impact", "constraints", "construction"]

[[case_studies]]
id = "parliament-radio"
title = "Radio system for the Canadian Parliament's police"
situation = "The Parliament's police needed a new radio system across 30 historic buildings and underground."
task = "Deliver a multi-year upgrade in heritage, high-security buildings."
action = "Managed heritage-building permits, security clearances, safety orientations and global logistics for multiple vendors, plus subcontracts, scheduling, budgets, reporting and contract changes."
result = "Radio system upgraded across 30 Parliament buildings."
tags = ["public sector", "security", "stakeholder management", "delivery"]

[[case_studies]]
id = "cv-mcp"
title = "This CV, served over MCP"
situation = "A PDF CV shows nothing about AI-native ways of working."
task = "Make the CV itself an AI-native artifact any agent can query."
action = "Built a Python/FastMCP server exposing structured CV tools, a role-fit tool and case studies over Streamable HTTP, deployable to Copilot Studio or Claude as a connector, with automated tests and a testing tier before production."
result = "Reviewers can interrogate the CV conversationally; the role-fit tool shows evidence against each criterion instead of claims."
tags = ["MCP", "agentic AI", "generative AI", "Copilot Studio", "Python", "innovation"]

[[case_studies]]
id = "homelab-agents"
title = "Self-hosted multi-agent platform"
situation = "Wanted hands-on, day-to-day experience of agentic AI on infrastructure under my own control."
task = "Run several AI agents on a home server, connected to real projects, with the safeguards an organisation would expect."
action = "Built a declarative NixOS server running several agent harnesses (Hermes Agent, OpenClaw, Omnigent) across multiple model providers with fallback chains, using Claude for heavy lifting and delegating simpler work to cheaper models. Gave agents access to projects through MCP servers split into read-only and token-protected control endpoints, kept secrets in sops-nix, and put changes through a Gitea, Woodpecker, Prometheus, Grafana and Loki pipeline with testing before production. Built and benchmarked Japanese-English translation agents."
result = "A working environment for testing agentic patterns end to end; its safeguards (read-only versus control access, secrets management, testing tiers, cost routing) carried straight into how this CV server was designed."
tags = ["agentic AI", "MCP", "governance", "cost control", "NixOS", "CI/CD", "Claude Code"]

