# release.yaml — promote a commit to production (on the Pi, public at https://n8k.org).
#
# Runs only on a Woodpecker deployment event to `production`: a human opens the
# pipeline of a commit that passed ci.yaml and cd.yaml and chooses Promote →
# production (or `woodpecker-cli pipeline deploy nate/cv-mcp <number> production`).
# That promotion is the approval; nothing reaches production on push.
#
# Production runs the exact image testing ran and ci.yaml scanned:
# gitea.local/nate/cv-mcp:<sha>. Nothing is rebuilt.
#
#   check    the commit is on main and its image exists in the registry
#   tag      move the `production` tag to that digest (a label; deploys use the SHA)
#   deploy   write compose.yaml and release.env into /opt/cicd/cv-mcp/production/;
#            cv-mcp-production-deploy.path (NixOS config) runs `docker compose up --wait`
#   verify   https://n8k.org/health through Cloudflare and the tunnel, twice in a row
#
# Rollback: promote the older commit's pipeline to production. It writes that commit's
# SHA tag; nothing is rebuilt.
#
# Uses only the global registry secrets (ci_registry_user, ci_registry_password).
# Needs the repo Trusted (network + volumes).

when:
  - event: deployment
    evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "production"'

clone:
  git:
    image: woodpeckerci/plugin-git
    extra_hosts:
      - "gitea.local:host-gateway"

variables:
  - &nix_env
    PATH: /nix/var/nix/profiles/system/sw/bin:/usr/sbin:/usr/bin:/sbin:/bin
    NIX_REMOTE: daemon
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      accept-flake-config = false
    XDG_CACHE_HOME: /woodpecker/.cache
  - &host_nix
    image: alpine:3.22
    volumes:
      - /nix:/nix:ro
    environment: *nix_env
  - &registry
    REGISTRY_USER:
      from_secret: ci_registry_user
    REGISTRY_PASSWORD:
      from_secret: ci_registry_password

steps:
  - name: check
    <<: *host_nix
    extra_hosts:
      - "gitea.local:host-gateway"
    environment:
      <<: [*nix_env, *registry]
    commands:
      # Only commits on main reach production.
      - '[ "${CI_COMMIT_BRANCH}" = main ] || { echo "refusing to promote branch ${CI_COMMIT_BRANCH}"; exit 1; }'
      # ci.yaml published this SHA only if lint, test and scan passed.
      - >-
        nix develop .#ci -c skopeo --insecure-policy inspect
        --creds "$REGISTRY_USER:$REGISTRY_PASSWORD" --format '{{.Digest}}'
        docker://gitea.local/nate/cv-mcp:${CI_COMMIT_SHA}

  - name: tag
    <<: *host_nix
    extra_hosts:
      - "gitea.local:host-gateway"
    environment:
      <<: [*nix_env, *registry]
    commands:
      - >-
        nix develop .#ci -c skopeo --insecure-policy copy
        --src-creds "$REGISTRY_USER:$REGISTRY_PASSWORD" --dest-creds "$REGISTRY_USER:$REGISTRY_PASSWORD"
        docker://gitea.local/nate/cv-mcp:${CI_COMMIT_SHA} docker://gitea.local/nate/cv-mcp:production

  - name: deploy
    image: alpine:3.22
    volumes:
      - /opt/cicd/cv-mcp/production:/deploy
    commands:
      - cp deploy/compose.yaml /deploy/compose.yaml
      # Written then renamed, so the path unit never sees a half-written file.
      - printf 'APP_IMAGE=gitea.local/nate/cv-mcp:%s\n' "${CI_COMMIT_SHA}" > /deploy/release.env.tmp
      - mv /deploy/release.env.tmp /deploy/release.env
      - cat /deploy/release.env

  - name: verify
    <<: *host_nix
    commands:
      # The deploy unit waits up to 180 s for the container's health check. Require two
      # healthy answers in a row from the public URL (the old container may still answer
      # for a moment while compose swaps them).
      - |
        nix develop .#ci -c sh -c '
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 https://n8k.org/health; then
              ok=$((ok + 1)); [ "$ok" -ge 2 ] && exit 0
            else ok=0; fi
            sleep 5
          done
          echo "https://n8k.org/health not healthy after promotion" >&2
          exit 1'
